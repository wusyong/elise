# The runs too slow for every push: every day the fuzzer, the Verus proofs
# and the TLA+ models; every week the whole test suite under Miri, split
# between machines. Any of them can also be started by hand (Actions → this
# workflow → Run workflow).
name: Scheduled

on:
  schedule:
    - cron: "0 3 * * *" # every day, 03:00 UTC
    - cron: "0 4 * * 0" # Sundays, 04:00 UTC
  workflow_dispatch:
    inputs:
      run:
        description: Which runs
        type: choice
        options: [all, fuzz, verus, tla, miri]
        default: all

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    if: >-
      github.event.schedule == '0 3 * * *' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all", "fuzz"]'), inputs.run))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # The fuzzer's nightly, which its rust-toolchain.toml pins.
      - run: rustup toolchain install
        working-directory: crates/elise/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # What the fuzzer found interesting, kept from run to run.
      - uses: actions/cache@v4
        with:
          path: target/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - run: python3 scripts/test.py fuzz --minutes 30
      # The failing input, and its minimized form: put it in
      # crates/elise/fuzz/regressions/ with the fix.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: target/fuzz/artifacts

  verus:
    if: >-
      github.event.schedule == '0 3 * * *' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all", "verus"]'), inputs.run))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      # The release `VERUS_VERSION` in scripts/test.py names.
      - id: version
        run: >-
          echo "verus=$(sed -n 's/^VERUS_VERSION = "\(.*\)"$/\1/p' scripts/test.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/verus
          key: verus-${{ steps.version.outputs.verus }}-x86-linux
      - name: Install Verus
        env:
          VERUS: ${{ steps.version.outputs.verus }}
        run: |
          if [ ! -d ~/verus/"$VERUS" ]; then
            curl -sSfL -o verus.zip \
              "https://github.com/verus-lang/verus/releases/download/release/$VERUS/verus-$VERUS-x86-linux.zip"
            mkdir -p ~/verus/"$VERUS"
            unzip -q verus.zip -d ~/verus/"$VERUS"
            rm verus.zip
          fi
          home="$(dirname "$(find ~/verus/"$VERUS" -name cargo-verus -type f | head -n 1)")"
          echo "VERUS_DIR=$home" >> "$GITHUB_ENV"
          # The Rust toolchain this release of Verus is built against, as
          # `verus --version` names it.
          toolchain="$("$home/verus" --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-x86_64-unknown-linux-gnu' | head -n 1)"
          rustup toolchain install "$toolchain"
      - run: python3 scripts/test.py verus

  tla:
    name: TLA+
    if: >-
      github.event.schedule == '0 3 * * *' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all", "tla"]'), inputs.run))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python3 tla/marking/check.py
      - run: python3 tla/unified/check.py

  miri:
    name: Miri (${{ matrix.part }}/6)
    if: >-
      github.event.schedule == '0 4 * * 0' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all", "miri"]'), inputs.run))
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    # A job may run 6 hours at most; the slowest test alone takes over half
    # of one.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      # The nightly the fuzzer's rust-toolchain.toml pins, which Miri runs on.
      - name: Install Miri
        run: |
          nightly="$(sed -n 's/^channel = "\(.*\)"$/\1/p' crates/elise/fuzz/rust-toolchain.toml)"
          rustup toolchain install "$nightly" --profile minimal --component miri,rust-src
          cargo "+$nightly" miri setup
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: python3 scripts/test.py miri --partition ${{ matrix.part }}/6
